
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
        }

        input {
            padding: 10px;
            margin: 5px;
            width: 90%;
        }

        button {
            padding: 8px 12px;
            margin: 5px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            background: #007bff;
            color: white;
        }

        .remove {
            background: red;
        }

        .product {
            background: #eee;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
        }

        .total {
            font-size: 20px;
            font-weight: bold;
            text-align: right;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Shopping Cart</h2>

    <h3>Add Product</h3>

    <input type="number" id="id" placeholder="Product ID">
    <input type="text" id="name" placeholder="Product Name">
    <input type="number" id="price" placeholder="Product Price">
    <input type="number" id="quantity" placeholder="Quantity">

    <button onclick="addProduct()">Add to Cart</button>

    <hr>

    <h3>My Cart</h3>

    <div id="cartItems"></div>

    <div class="total">
        Total: ₹<span id="total">0</span>
    </div>

</div>

<script>

let cart = [];

function addProduct() {

    let id = Number(document.getElementById("id").value);
    let name = document.getElementById("name").value;
    let price = Number(document.getElementById("price").value);
    let quantity = Number(document.getElementById("quantity").value);

    if (!id || !name.trim() || price <= 0 || quantity <= 0) {
        alert("Please enter valid product details");
        return;
    }

    let product = cart.find(item => item.id === id);

    if (product) {
        product.quantity += quantity;
    } else {
        cart.push({
            id: id,
            name: name,
            price: price,
            quantity: quantity
        });
    }

    displayCart();

    document.getElementById("id").value = "";
    document.getElementById("name").value = "";
    document.getElementById("price").value = "";
    document.getElementById("quantity").value = "";
}

function displayCart() {

    let cartItems = document.getElementById("cartItems");

    cartItems.innerHTML = "";

    cart.forEach(item => {

        cartItems.innerHTML += `
            <div class="product">

                <h3>${item.name}</h3>

                <p>Price: ₹${item.price}</p>

                <p>Quantity: ${item.quantity}</p>

                <p>Subtotal: ₹${item.price * item.quantity}</p>

                <button onclick="updateProduct(${item.id})">
                    Update Quantity
                </button>

                <button class="remove"
                    onclick="removeProduct(${item.id})">
                    Remove
                </button>

            </div>
        `;

    });

    calculateTotal();
}

function removeProduct(id) {

    cart = cart.filter(item => item.id !== id);

    displayCart();
}

function updateProduct(id) {

    let product = cart.find(item => item.id === id);

    if (product) {

        let newQuantity = Number(
            prompt("Enter new quantity:", product.quantity)
        );

        if (newQuantity > 0 && Number.isInteger(newQuantity)) {
            product.quantity = newQuantity;
            displayCart();
        } else if (newQuantity !== 0) {
            alert("Please enter a valid quantity");
        }
    }
}

function calculateTotal() {

    let total = 0;

    cart.forEach(item => {
        total += item.price * item.quantity;
    });

    document.getElementById("total").innerText = total;
}

</script>

</body>
</html>
